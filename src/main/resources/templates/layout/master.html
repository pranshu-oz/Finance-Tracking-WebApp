<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<!-- [Head] start -->

<head th:fragment="headelement">
  <title th:text="${pageTitle}"></title>
  <!-- [Meta] -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description"
    content="Mantis is made using Bootstrap 5 design framework. Download the free admin template & use it for your project.">
  <meta name="keywords"
    content="Mantis, Dashboard UI Kit, Bootstrap 5, Admin Template, Admin Dashboard, CRM, CMS, Bootstrap Admin Template">
  <meta name="author" content="Expense Tracker">

  <!-- [Favicon] icon -->
  <link rel="icon" th:href="@{/assets/images/favicon.svg}" type="image/x-icon"> <!-- [Google Font] Family -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
    id="main-font-link">
  <!-- [Tabler Icons] https://tablericons.com -->
  <link rel="stylesheet" th:href="@{/assets/fonts/tabler-icons.min.css}">
  <!-- [Feather Icons] https://feathericons.com -->
  <link rel="stylesheet" th:href="@{/assets/fonts/feather.css}">
  <!-- [Font Awesome Icons] https://fontawesome.com/icons -->
  <link rel="stylesheet" th:href="@{/assets/fonts/fontawesome.css}">
  <!-- [Material Icons] https://fonts.google.com/icons -->
  <link rel="stylesheet" th:href="@{/assets/fonts/material.css}">
  <!-- [Template CSS Files] -->
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" id="main-style-link">
  <link rel="stylesheet" th:href="@{/assets/css/style-preset.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<!-- [Head] end -->
<!-- [Body] Start -->

<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
  <!-- [ Pre-loader ] start -->
  <div class="loader-bg">
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>
  </div>
  <!-- [ Pre-loader ] End -->
  <!-- [ Sidebar Menu ] start -->
  <nav class="pc-sidebar" th:fragment="sidebar">
    <div class="navbar-wrapper">
      <div class="m-header">
        <a th:href="@{/}" class="b-brand text-primary">
          <!-- ========   Change your logo from here   ============ -->
          <!-- <img src="../assets/images/logo-dark.svg" class="img-fluid logo-lg" alt="logo"> -->
          <h5>Expense Tracker</h5>
        </a>
      </div>
      <div class="navbar-content">
        <ul class="pc-navbar">
          <li class="pc-item">
            <a th:href="@{/}" class="pc-link">
              <span class="pc-micon"><i class="ti ti-dashboard"></i></span>
              <span class="pc-mtext">Dashboard</span>
            </a>
          </li>

          <li class="pc-item pc-caption">
            <label>Manage Reports</label>
            <i class="ti ti-dashboard"></i>
          </li>
          <li class="pc-item">
            <a th:href="@{/Transaction}" class="pc-link">
              <span class="pc-micon"><i class="fa-solid fa-book"></i></span>
              <span class="pc-mtext">Transaction</span>
            </a>
          </li>
          <li class="pc-item">
            <a th:href="@{/Transaction/add}" class="pc-link">
              <span class="pc-micon"><i class="fa-solid fa-pen-to-square"></i></span>
              <span class="pc-mtext">New Transaction</span>
            </a>
          </li>


          <li class="pc-item pc-caption">
            <label>Categories</label>
            <i class="ti ti-news"></i>
          </li>
          <li class="pc-item">
            <a th:href="@{/category}" class="pc-link">
              <span class="pc-micon"><i class="fa-solid fa-tag"></i></span>
              <span class="pc-mtext">Show Category</span>
            </a>
          </li>
          <li class="pc-item">
            <a th:href="@{/category/add}" class="pc-link">
              <span class="pc-micon"><i class="fa-solid fa-pen"></i></span>
              <span class="pc-mtext">Add Category</span>
            </a>
          </li>

          <li class="pc-item pc-caption">
            <label>Other</label>
            <i class="ti ti-brand-chrome"></i>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- [ Sidebar Menu ] end --> <!-- [ Header Topbar ] start -->
  <header class="pc-header" th:fragment="header">
    <div class="header-wrapper"> <!-- [Mobile Media Block] start -->
      <div class="me-auto pc-mob-drp">
        <ul class="list-unstyled">
          <!-- ======= Menu collapse Icon ===== -->
          <li class="pc-h-item pc-sidebar-collapse">
            <a href="#" class="pc-head-link ms-0" id="sidebar-hide">
              <i class="ti ti-menu-2"></i>
            </a>
          </li>
          <li class="pc-h-item pc-sidebar-popup">
            <a href="#" class="pc-head-link ms-0" id="mobile-collapse">
              <i class="ti ti-menu-2"></i>
            </a>
          </li>
          <li class="dropdown pc-h-item d-inline-flex d-md-none">
            <a class="pc-head-link dropdown-toggle arrow-none m-0" data-bs-toggle="dropdown" href="#" role="button"
              aria-haspopup="false" aria-expanded="false">
              <i class="ti ti-search"></i>
            </a>
            <div class="dropdown-menu pc-h-dropdown drp-search">
              <form class="px-3">
                <div class="form-group mb-0 d-flex align-items-center">
                  <i data-feather="search"></i>
                  <input type="search" class="form-control border-0 shadow-none" placeholder="Search here. . .">
                </div>
              </form>
            </div>
          </li>
          <!-- <li class="pc-h-item d-none d-md-inline-flex">
            <form class="header-search">
              <i data-feather="search" class="icon-search"></i>
              <input type="search" class="form-control" placeholder="Search here. . .">
            </form>
          </li> -->
        </ul>
      </div>
      <!-- [Mobile Media Block end] -->
      <div class="ms-auto">
        <ul class="list-unstyled">
          <li class="dropdown pc-h-item">
            <a class="pc-head-link dropdown-toggle arrow-none me-0" data-bs-toggle="dropdown" href="#" role="button"
              aria-haspopup="false" aria-expanded="false">
              <i class="ti ti-mail"></i>
            </a>
          </li>
          <li class="dropdown pc-h-item header-user-profile">
            <a class="pc-head-link dropdown-toggle arrow-none me-0" data-bs-toggle="dropdown" href="#" role="button"
              aria-haspopup="false" data-bs-auto-close="outside" aria-expanded="false">
              <img th:src="@{/assets/images/user/avatar-2.jpg}" alt="user-image" class="user-avtar">
              <span>User</span>
            </a>
            <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown">
              <div class="dropdown-header">
                <div class="d-flex mb-1">
                  <div class="flex-shrink-0">
                    <img src="@{/assets/images/user/avatar-2.jpg}" alt="user-image" class="user-avtar wid-35">
                  </div>
                  <div class="flex-grow-1 ms-3">
                    <h6 class="mb-1">Stebin Ben</h6>
                    <span>UI/UX Designer</span>
                  </div>
                  <a href="#!" class="pc-head-link bg-transparent"><i class="ti ti-power text-danger"></i></a>
                </div>
              </div>
              <ul class="nav drp-tabs nav-fill nav-tabs" id="mydrpTab" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="drp-t1" data-bs-toggle="tab" data-bs-target="#drp-tab-1"
                    type="button" role="tab" aria-controls="drp-tab-1" aria-selected="true"><i class="ti ti-user"></i>
                    Profile</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="drp-t2" data-bs-toggle="tab" data-bs-target="#drp-tab-2" type="button"
                    role="tab" aria-controls="drp-tab-2" aria-selected="false"><i class="ti ti-settings"></i>
                    Setting</button>
                </li>
              </ul>
              <div class="tab-content" id="mysrpTabContent">
                <div class="tab-pane fade show active" id="drp-tab-1" role="tabpanel" aria-labelledby="drp-t1"
                  tabindex="0">
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-edit-circle"></i>
                    <span>Edit Profile</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-user"></i>
                    <span>View Profile</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-clipboard-list"></i>
                    <span>Social Profile</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-wallet"></i>
                    <span>Billing</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-power"></i>
                    <span>Logout</span>
                  </a>
                </div>
                <div class="tab-pane fade" id="drp-tab-2" role="tabpanel" aria-labelledby="drp-t2" tabindex="0">
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-help"></i>
                    <span>Support</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-user"></i>
                    <span>Account Settings</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-lock"></i>
                    <span>Privacy Center</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-messages"></i>
                    <span>Feedback</span>
                  </a>
                  <a href="#!" class="dropdown-item">
                    <i class="ti ti-list"></i>
                    <span>History</span>
                  </a>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </header>
  <!-- [ Header ] end -->
  <!-- [ Main Content ] start -->
  <div class="pc-container" th:fragment="status-ref">
    <div class="pc-content">
      <!-- [ breadcrumb ] start -->
      <div class="page-header">
        <div class="page-block">
          <div class="row align-items-center">
            <div class="col-md-12">
              <div class="page-header-title">
                <h5 class="m-b-10" th:text="${activePage}">Home</h5>
              </div>
              <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="../">Home</a></li>
                <li class="breadcrumb-item"><a
                    th:text="${activePage}+(${subPage}!=null ?'/'+${subPage}:'')">Dashboard</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <hr>
    </div>

    <!-- [ Main Content ] end -->
    <footer class="pc-footer" th:fragment="footer-ref">

    </footer>

    <div th:fragment="plugin-required">
      <!-- [Page Specific JS] start -->
      <script th:src="@{/assets/js/plugins/apexcharts.min.js}"></script>
      <!-- [Page Specific JS] end -->
      <!-- Required Js -->
      <script th:src="@{/assets/js/plugins/popper.min.js}"></script>
      <script th:src="@{/assets/js/plugins/simplebar.min.js}"></script>
      <script th:src="@{/assets/js/plugins/bootstrap.min.js}"></script>
      <script th:src="@{/assets/js/fonts/custom-font.js}"></script>
      <script th:src="@{/assets/js/pcoded.js}"></script>
      <script th:src="@{/assets/js/plugins/feather.min.js}"></script>
      <script th:src="@{/assets/js/ajax.js}"></script>




      <script>layout_change('light');</script>




      <script>change_box_container('false');</script>



      <script>layout_rtl_change('false');</script>


      <script>preset_change("preset-1");</script>


      <script>font_change("Public-Sans");</script>


    </div>
</body>
<!-- [Body] end -->

</html>
